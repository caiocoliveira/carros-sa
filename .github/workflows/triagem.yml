name: triagem-diaria

# Cron migrado do laptop pra cá (2026-05-06): macOS estava dormindo nos
# horários do cron local e perdendo runs. UTC-3 ano todo (Brasil sem DST):
# 10:00 UTC = 07:00 BRT, 16:00 UTC = 13:00 BRT.
#
# Estado (SQLite + cookies + PDFs de laudo) persiste numa branch órfã `state/db`
# via git plumbing — sem worktree, sem checkout, só blob+tree+commit-tree+push.
#
# Por que persistir os PDFs também (ajuste 2026-05-09): a audit
# `verificar_laudo_completo` exige PDF on-disk como uma das 3 condições de
# "laudo completo". Em runs subsequentes ao 1º, o DB já trazia LaudoCache
# com confidence>=0.6, mas a pasta `data/laudos_pdfs/` ressuscitava VAZIA —
# o filtro do retry (`--somente-laudo-pendente` = confidence<0.6) ignorava
# esses lotes e o `auditar_laudos --strict` no fim do workflow falhava
# cronicamente com motivo `pdf_ausente`. Persistir os PDFs alinha o estado
# operacional (auditoria estrita verde) com o estado real (laudo já analisado).
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   AUTOAVALIAR_EMAIL          — login do Auto Avaliar
#   AUTOAVALIAR_PASSWORD       — senha
#   GEMINI_API_KEY             — vision default
#   ANTHROPIC_API_KEY          — opcional, fallback
#   GOOGLE_SHEETS_ID           — ID da planilha de output
#   GOOGLE_SERVICE_ACCOUNT_JSON — conteúdo COMPLETO do JSON da service account

on:
  schedule:
    - cron: '0 10,16 * * *'
  workflow_dispatch:
    inputs:
      reset_circuit_breaker:
        description: >
          Zera LaudoCache.tentativas_extracao em todas as rows com confidence<0.6
          ANTES da triagem. Use UMA VEZ após melhorar uma camada do extrator
          (ex.: novo vendor cobrindo lotes presos por DD4 + paridade text_llm_client).
          NÃO marcar em runs automáticas — anula o circuit-breaker.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: triagem-diaria
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 240min: primeira rodada (sem cookies/DB) precisa logar do zero, varrer
    # listagem completa, baixar PDF de cada lote e rodar Gemini Flash em cada
    # laudo. Rodadas subsequentes (cookies + DB cacheados via state/db) são
    # incrementais e ficam bem abaixo de 90min.
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      AUTOAVALIAR_COOKIES_PATH: ${{ github.workspace }}/.state/autoavaliar_cookies.json
      CARROS_SA_DB: ${{ github.workspace }}/carros_sa.db
      # Runner do GH Actions é UTC. Todo o pipeline usa `datetime.now()` naive
      # local pra comparações de `fim_em` (ver LESSONS.md / CLAUDE.md
      # "Lote.fim_em é naive LOCAL — nunca UTC"). Sem isso, lotes encerrados
      # parecem ativos e o banner da planilha sai 3h adiantado.
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - name: Restore SQLite + cookies + PDFs from state/db branch
        run: |
          mkdir -p .state data/laudos_pdfs
          git fetch origin state/db:refs/remotes/origin/state/db 2>/dev/null || echo "state/db branch não existe ainda"
          if git show origin/state/db:carros_sa.db > /tmp/db.new 2>/dev/null; then
            mv /tmp/db.new carros_sa.db
            echo "DB restaurado ($(stat -c%s carros_sa.db) bytes)"
          else
            rm -f /tmp/db.new
            echo "Sem DB prévio — pipeline começa do zero"
          fi
          if git show origin/state/db:autoavaliar_cookies.json > /tmp/ck.new 2>/dev/null; then
            mv /tmp/ck.new "$AUTOAVALIAR_COOKIES_PATH"
            echo "Cookies restaurados"
          else
            rm -f /tmp/ck.new
            echo "Sem cookies — vai logar com email/senha"
          fi
          # PDFs ficam numa subárvore `laudos_pdfs/` no commit órfão. ls-tree
          # pode falhar quando o branch ainda não tem a subárvore (rev. 1ª
          # passagem após o ajuste): redirecionar stderr e tratar saída vazia
          # como "sem PDFs prévios" — falha branda, pipeline segue.
          n_pdfs=0
          if git ls-tree origin/state/db laudos_pdfs/ 2>/dev/null | grep -q '^'; then
            while IFS=$'\t' read -r meta path; do
              # meta = "<mode> <type> <sha>"; só interessa quando type=blob.
              type=$(printf '%s' "$meta" | awk '{print $2}')
              [ "$type" = "blob" ] || continue
              [ -z "$path" ] && continue
              git show "origin/state/db:$path" > "data/laudos_pdfs/$(basename "$path")" 2>/dev/null && n_pdfs=$((n_pdfs+1)) || true
            done < <(git ls-tree origin/state/db laudos_pdfs/)
            echo "PDFs restaurados: $n_pdfs"
          else
            echo "Sem PDFs prévios em state/db"
          fi

      # actions/setup-python pin do Python 3.12 (projeto exige). astral-sh/setup-uv@v3
      # NÃO aceita `python-version` como input (válidos: version, checksum,
      # github-token, enable-cache, cache-dependency-glob) — passar lá silencia
      # o pin e o runner cai no Python default do ubuntu-latest.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Instala uv via pip em vez de astral-sh/setup-uv@v3 — o action
      # v3 sempre tenta resolver `**/uv.lock` (mesmo com enable-cache: false)
      # e o projeto usa só pyproject.toml. pip install é simples e não tem
      # esse acoplamento implícito.
      - name: Install uv
        run: python -m pip install uv

      - name: Install deps + Chromium
        run: |
          uv venv .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install -e ".[dev]"
          .venv/bin/playwright install --with-deps chromium

      - name: Materializa Google service account JSON
        run: |
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/gsa.json"
          echo "GOOGLE_SERVICE_ACCOUNT_PATH=$RUNNER_TEMP/gsa.json" >> "$GITHUB_ENV"

      - name: Migra schema (idempotente)
        run: .venv/bin/python scripts/migrar_tentativas_extracao.py

      # One-shot manual: zera circuit-breaker em lotes com cache fraco. Só roda
      # quando o operador dispara "Run workflow" com a checkbox marcada. O cron
      # automático NUNCA passa por aqui — circuit-breaker (II) precisa continuar
      # defendendo lotes com input ruim em perma-loop. Uso típico: após
      # melhorar uma camada do extrator (ex.: novo vendor coberto pela camada 4
      # do DD4 + paridade text_llm_client no retry — 2026-05-22), destravar
      # lotes que foram congelados pelo gap.
      - name: Reset circuit-breaker (manual, opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_circuit_breaker == true }}
        run: .venv/bin/python scripts/laudo_reset_tentativas.py --apply

      - name: Triagem + limpa decoys + retry de laudos pendentes + audit gate
        env:
          AUTOAVALIAR_EMAIL: ${{ secrets.AUTOAVALIAR_EMAIL }}
          AUTOAVALIAR_PASSWORD: ${{ secrets.AUTOAVALIAR_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          .venv/bin/python scripts/triagem_diaria.py --empresa carros_uberlandia
          .venv/bin/python scripts/limpar_decoys_laudo.py
          .venv/bin/python scripts/reprocessar_lotes_do_db.py \
            --empresa carros_uberlandia --somente-ativos --somente-laudo-pendente
          # Audit gate final — fecha o laço "todo lote ativo na planilha
          # tem PDF baixado + cache forte + URL clicável". Igual ao
          # `auditar_laudos --strict` do `setup_cron.sh` local. Sem isso,
          # lotes com "⚠ LAUDO NÃO CAPTURADO" vazam silenciosamente pra
          # planilha e o operador só descobre olhando.
          .venv/bin/python scripts/auditar_laudos.py \
            --empresa carros_uberlandia --strict

      - name: Persiste DB + cookies + PDFs em state/db
        if: always()
        run: |
          if [ ! -s carros_sa.db ]; then
            echo "DB vazio/ausente — nada a persistir"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BLOB_DB=$(git hash-object -w carros_sa.db)
          TREE_INPUT="$(printf '100644 blob %s\tcarros_sa.db' "$BLOB_DB")"
          if [ -s "$AUTOAVALIAR_COOKIES_PATH" ]; then
            BLOB_CK=$(git hash-object -w "$AUTOAVALIAR_COOKIES_PATH")
            TREE_INPUT="$TREE_INPUT"$'\n'"$(printf '100644 blob %s\tautoavaliar_cookies.json' "$BLOB_CK")"
          fi

          # Subárvore `laudos_pdfs/` com os PDFs baixados na run atual + os
          # restaurados de state/db. Filtra >5KB (mesmo threshold do
          # `_pdf_eh_laudo_valido` no orquestrador) pra não persistir HTML
          # de erro salvo como .pdf por engano.
          PDFS_TREE=""
          if [ -d data/laudos_pdfs ]; then
            PDFS_INPUT=$(
              find data/laudos_pdfs -maxdepth 1 -name '*.pdf' -size +5k -print 2>/dev/null | while read -r f; do
                BLOB=$(git hash-object -w "$f")
                printf '100644 blob %s\t%s\n' "$BLOB" "$(basename "$f")"
              done
            )
            if [ -n "$PDFS_INPUT" ]; then
              PDFS_TREE=$(printf '%s\n' "$PDFS_INPUT" | git mktree)
              n_pdfs=$(printf '%s\n' "$PDFS_INPUT" | wc -l | tr -d ' ')
              echo "PDFs persistidos: $n_pdfs"
            else
              echo "Sem PDFs >5KB em data/laudos_pdfs/"
            fi
          fi
          if [ -n "$PDFS_TREE" ]; then
            TREE_INPUT="$TREE_INPUT"$'\n'"$(printf '040000 tree %s\tlaudos_pdfs' "$PDFS_TREE")"
          fi
          TREE=$(printf '%s\n' "$TREE_INPUT" | git mktree)

          PARENT=""
          if git rev-parse --verify --quiet refs/remotes/origin/state/db >/dev/null 2>&1; then
            PARENT=$(git rev-parse refs/remotes/origin/state/db)
          fi
          MSG="state @ $(date -u +%FT%TZ) (run ${{ github.run_id }})"
          if [ -n "$PARENT" ]; then
            COMMIT=$(echo "$MSG" | git commit-tree "$TREE" -p "$PARENT")
          else
            COMMIT=$(echo "$MSG" | git commit-tree "$TREE")
          fi
          git push origin "$COMMIT:refs/heads/state/db"

      # Quando o pipeline falha, o estado parcial vai pra artifact retido por
      # 7 dias pra debug post-mortem. NÃO inclui cookies (credencial Auto Avaliar)
      # nem PDFs de laudo (ruído binário, recriáveis a partir do DB).
      - name: Upload DB parcial em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carros-sa-db-${{ github.run_id }}
          path: carros_sa.db
          retention-days: 7
          if-no-files-found: ignore
