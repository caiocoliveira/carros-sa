empresa_id: carros_uberlandia
nome: "Carros SA - Uberlândia"
patio:
  cidade: "Uberlândia"
  uf: "MG"
  cep: "38400-000"
# Margem calibrada com a operação real: Caio busca ~25% sobre venda (≈33% sobre
# custo), validado pelo histórico do Polo Track 2024 (lucro líquido R$ 10.964
# sobre R$ 52.200 investidos = 21% após desconto VJCAR; 28% bruto pré-desconto).
#
# VJCAR = parceiro operacional que cobra 30% do LUCRO LÍQUIDO da operação
# (venda - capital - reforma - frete - taxas - custo_op). A `margem.base = 0.25`
# atual já EMBUTE esse desconto na calibração (target = ~25% sobre venda LÍQUIDO
# da operação dele). NÃO modelado explicitamente no precificador hoje — se um
# dia a parceria com VJCAR mudar (cut diferente, sair, dividir com outro), o
# caminho é adicionar `comissoes.vjcar_pct: 0.30` aqui + ler em precificador.py
# antes de aplicar margem. Por enquanto, manter como FACT registrado e
# recalibrar `margem.base` quando o cenário mudar.
margem:
  base: 0.25                    # 25% sobre o preço de giro (venda âncora)
  minima_absoluta: 0.10         # nunca abaixo disso
raio_max_km: 1000
# Raio operacional: cidades dentro desse raio (haversine a partir do pátio)
# entram na busca de lotes. 150km cobre Triângulo Mineiro + cidades fronteiriças
# de GO e SP. Cada cidade gera 1 request ao Auto Avaliar na coleta de listagem.
# Frete é 0 pra lotes na mesma cidade do pátio (o próprio comprador busca).
raio_operacao_km: 150
fator_risco_bounds: [1.0, 2.0]
fator_liquidez_bounds: [1.0, 1.8]
tabela_frete:                   # R$ por faixa_km × categoria
  "0-300":
    hatch: 800
    sedan: 800
    suv: 1200
    utilitario: 1500
    picape: 1500
    outro: 1200
  "300-600":
    hatch: 1400
    sedan: 1400
    suv: 1900
    utilitario: 2300
    picape: 2300
    outro: 1900
  "600-1000":
    hatch: 2200
    sedan: 2200
    suv: 2800
    utilitario: 3400
    picape: 3400
    outro: 2800
  "1000-2000":
    hatch: 3000
    sedan: 3000
    suv: 3800
    utilitario: 4500
    picape: 4500
    outro: 3800
categorias_aceitas: [hatch, sedan, suv, utilitario, picape]
# Taxa Auto Arremate calibrada em N=1 (Fusion 2014: R$866,80 sobre R$55.500 = 1.56%).
# Modelada como percentual do lance vencedor — `taxa_leilao_fixa` zerada.
# Recalibrar quando tiver ≥3 notas decompostas (coluna taxa_leilao_real no CSV).
taxa_leilao_pct: 0.0156
taxa_leilao_fixa: 0
# Custos operacionais não-veículo decompostos — calibrados com a operação real
# do Polo Track 2024 (despachante R$380, polimento R$450, marketing IG/FB/portais
# R$1500 médio, laudo cautelar pré-venda R$120, combustível R$73). Total = R$2523.
# `transferencia_interestadual` é CONDICIONAL ao lote (origem.uf != patio.uf) e
# NÃO entra na soma recorrente — somado por-lote em `custo_op_para_lote`. Valor
# calibrado em N=1 com a compra real Fusion 2014 SP→MG (DETRAN-MG mudança de
# estado, segundo emplacamento). Recalibrar quando tiver ≥5 transferências
# interestaduais decompostas no CSV (ver follow-up #2 do workstream HH).
custos_operacionais:
  despachante: 380
  higienizacao: 450
  marketing_medio: 1500
  laudo_cautelar: 120
  combustivel: 73
  transferencia_interestadual: 580
