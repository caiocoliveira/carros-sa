# Ranking aproximado de emplacamentos de automóveis novos no Brasil — top 30
# por categoria, baseado em dados públicos da FENABRAVE referência mar/2026.
#
# Como atualizar (rotina mensal):
#   1. Baixar PDF/CSV mensal em https://www.fenabrave.org.br/
#   2. Ler ranking de "Automóveis e comerciais leves" por modelo
#   3. Agrupar por categoria do nosso enum (HATCH/SEDAN/SUV/PICAPE/UTILITARIO)
#   4. Manter top 30 por categoria, ordem decrescente de unidades emplacadas
#
# Usado SOMENTE como sinal RELATIVO de popularidade — nunca o valor absoluto.
# Ver `carros_sa/tools/popularidade.py` pra como o ranking vira multiplicador
# de dias_giro_estimado (top 5 = blockbuster × 0.6, etc.).
#
# Carros descontinuados mas com forte presença no mercado de USADO (Polo
# antigo, Voyage, Gol, Uno, Ka, Fit) entram mesmo sem emplacamento atual,
# em posições medianas, pra refletir a demanda real do nosso negócio.

referencia_mes: "2026-03"
fonte: "FENABRAVE — emplacamentos de automóveis (mar/2026, dados curados)"

