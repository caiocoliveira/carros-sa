[project]
name = "carros-sa"
version = "0.1.0"
description = "Sistema multi-agente, multi-empresa para triagem de lotes em leilões de carro"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.0.10",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlmodel>=0.0.22",
    "playwright>=1.47",
    "playwright-stealth>=1.0.6",
    "duckdb>=1.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
carros-sa = "carros_sa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carros_sa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
