[project]
name = "carros-sa"
version = "0.1.0"
description = "Sistema multi-agente, multi-empresa para triagem de lotes em leilões de carro"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.0.10",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlmodel>=0.0.22",
    "playwright>=1.47",
    "playwright-stealth>=1.0.6",
    "duckdb>=1.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "gspread>=6.0",
    "google-api-python-client>=2.100",  # Drive uploader (link permanente do laudo)
    # Adicionados explicitamente no upgrade 3.9 → 3.12 (estavam só no venv
    # antigo, sem trilha em pyproject — recriar venv quebrava o pipeline).
    "anthropic>=0.40",      # vision/text fallback
    "google-genai>=1.0",    # Gemini default
    "pymupdf>=1.26",        # parse de laudo (textual)
    "pypdf>=5.0",           # parse de laudo (validação rápida)
    "pillow>=11.0",         # PDF→imagem pra visão
    "tenacity>=9.0",        # retry decorator (FIPE etc)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
carros-sa = "carros_sa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carros_sa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
